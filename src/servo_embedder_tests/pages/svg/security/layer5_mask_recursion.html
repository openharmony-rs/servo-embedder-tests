<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Layer 5b — self-referencing mask</title>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <defs>
    <!-- Self-referencing mask: the mask's own rect re-applies #m, forever. -->
    <mask id="m">
      <rect width="200" height="200" fill="white" mask="url(#m)"/>
    </mask>
  </defs>

  <rect width="200" height="200" fill="red" mask="url(#m)"/>
</svg>

<!--
  Expected: no hang, no crash. Nested <mask> resolution is capped by
  MAX_MASK_DEPTH in components/svg/render/effects/mask.rs, so the
  self-reference terminates.

  Run with:
    ./target/debug/servoshell.exe -z --window-size=200x200 -o out.png \
      file:///D:/Projects/svg-tests/security/layer5_mask_recursion.html \
      --pref layout_servo_svg_enabled
-->
</body>
</html>
